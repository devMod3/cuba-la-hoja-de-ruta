<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
  <title>About viewport characterization</title>
  <style>
    :root{--zen-header-h:101px;--zen-player-safe:56px;--zen-text:#f2f0ea;--zen-accent:#d5b46a}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0f1113;color:#f2f0ea}
    #zen-about{display:block;width:100%;height:calc(100vh - var(--zen-header-h));}
  </style>
</head>
<body>
  <section aria-hidden="false" class="zen-view" data-zen-view="about" id="zen-about">
    <div class="zen-reading" data-about-fallback="true">
      <h1>La hoja de ruta</h1>
      <p>Plataforma editorial y documental para organizar, leer y recuperar conocimiento sobre soberanía, Constitución y Estado.</p>
    </div>
  </section>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const source = params.get('source') || 'canonical';
    const state = params.get('state') || 'populated';
    const cssHref = source === 'production'
      ? '/tests/fixtures/about-production-v0.1.5.css'
      : '/tools/about/about.css';

    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = `${cssHref}?t=${Date.now()}`;
    const cssReady = new Promise((resolve) => {
      stylesheet.addEventListener('load', () => resolve(true), { once: true });
      stylesheet.addEventListener('error', () => resolve(false), { once: true });
    });
    document.head.appendChild(stylesheet);
    if (!await cssReady) throw new Error(`About CSS failed: ${cssHref}`);

    localStorage.removeItem('zenSiteProfile.v1');
    if (state === 'populated') {
      localStorage.setItem('zenSiteProfile.v1', JSON.stringify({
        schemaVersion: '1.0.0',
        profile: {
          displayName: 'La hoja de ruta',
          photoUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=',
          occupation: 'Plataforma editorial',
          industry: 'Documentación',
          introduction: 'Plataforma editorial y documental para organizar, leer y recuperar conocimiento sobre soberanía, Constitución y Estado.',
          location: { city: 'Elizabeth', region: 'NJ', country: 'Estados Unidos' },
          website: 'https://example.com/',
          email: 'contacto@example.com'
        },
        social: [
          { id: 'x', platform: 'x', label: 'X', username: '@hojaderuta', url: 'https://x.com/example', visible: true, order: 0 },
          { id: 'github', platform: 'github', label: 'GitHub', username: 'devMod3', url: 'https://github.com/devMod3', visible: true, order: 1 }
        ],
        relatedResources: [
          { id: 'r1', title: 'Constitución de 1940 — recurso documental de referencia extremadamente largo', url: 'https://example.com/recurso', description: 'Referencia documental para probar wrapping, lectura y ausencia de overflow horizontal en pantallas estrechas.', type: 'source', visible: true, order: 0 }
        ]
      }));
    }

    const { AboutFeature } = await import('/tools/about/AboutFeature.js');
    const feature = new AboutFeature().mount();
    document.body.dataset.aboutReady = String(Boolean(feature));
  </script>
</body>
</html>
