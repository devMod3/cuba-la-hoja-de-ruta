name: Restore Pages After Stale Deployment

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-stale-guard-v1
  cancel-in-progress: true

jobs:
  assess:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      restore: ${{ steps.freshness.outputs.restore }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Detect stale Pages deployment
        id: freshness
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "$DEPLOYED_SHA" == "$CURRENT_SHA" ]]; then
            echo "restore=false" >> "$GITHUB_OUTPUT"
            echo "Pages deployment is current: $DEPLOYED_SHA"
          else
            echo "restore=true" >> "$GITHUB_OUTPUT"
            echo "Stale Pages deployment detected: deployed=$DEPLOYED_SHA current=$CURRENT_SHA"
          fi

  restore:
    needs: assess
    if: ${{ needs.assess.result == 'success' && needs.assess.outputs.restore == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Assert durable Pages repository boundary
        run: .github/scripts/assert-repository-boundary.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0

      - name: Install frozen dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile

      - name: Configure Pages metadata
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build current main static export
        working-directory: next
        env:
          ZENBLOG_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --filter @zenblog/web build

      - name: Verify static export artifact
        working-directory: next
        shell: bash
        env:
          ZENBLOG_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          test -d apps/web/out/_next
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          test -n "$(find apps/web/out -type f -print -quit)"
          node scripts/check-portable-export.ts

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: next/apps/web/out

      - name: Restore current main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
