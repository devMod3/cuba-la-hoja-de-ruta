name: Validate ZenBlog

on:
  push:
    branches: [main, lab-v0.1-architecture, next-v1-foundation]
  pull_request:
    branches: [main, 001-release-line-convergence, next-v1-foundation]

permissions:
  contents: read

concurrency:
  group: legacy-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: JavaScript and project standards checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: About browser smoke
        run: |
          (google-chrome --version || chromium --version || chromium-browser --version)
          npm run test:browser

      - name: Validate Blogger XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('blogger/theme.xml')
          print('blogger/theme.xml: XML well-formed')
          PY

      - name: Architecture invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          xml = Path('blogger/theme.xml').read_text()
          assert xml.count("id='Blog1'") == 1
          assert xml.count("id='page_body'") == 1
          assert 'zen_main' not in xml
          assert 'zen-radio-player/assets/zen-radio-player.js?v=1.0.4' in xml
          assert 'dist/zenblog.js' in xml
          assert 'tools/runtime/bootstrap.js' in xml
          assert 'dist/zenblog.css' not in xml
          for path in (
              'src/ui/styles/tokens.css', 'src/ui/styles/shell.css',
              'src/features/home/home.css', 'src/features/explore/explore.css',
              'src/features/article/article.css', 'src/ui/styles/responsive.css'):
              assert path in xml
          assert "name='twitter:card'" in xml
          assert "property='og:image'" in xml
          assert 'application/ld+json' in xml
          print('ZenBlog production invariants: PASS')
          PY
