name: Blogger Content Control Plane

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blogger-content-control-plane
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'devMod3/cuba-la-hoja-de-ruta'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Install immutable workspace
        working-directory: next
        run: pnpm install --frozen-lockfile
      - name: Synchronize controlled Blogger snapshot
        working-directory: next
        env:
          ZENBLOG_BLOGGER_ORIGIN: https://cubalahojaderuta.blogspot.com
        run: pnpm content:snapshot:sync
      - name: Detect content drift
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- \
            next/packages/content-snapshot/content/blogger.snapshot.json \
            next/packages/content-snapshot/content/blogger.snapshot.metadata.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'BLOGGER_CONTROL_PLANE=UNCHANGED'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'BLOGGER_CONTROL_PLANE=CHANGED'
          fi
      - name: Validate synchronized candidate
        if: steps.drift.outputs.changed == 'true'
        working-directory: next
        run: pnpm check
      - name: Commit robot-owned snapshot branch
        if: steps.drift.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          branch='automation/blogger-snapshot'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            next/packages/content-snapshot/content/blogger.snapshot.json \
            next/packages/content-snapshot/content/blogger.snapshot.metadata.txt
          git diff --cached --check
          git commit -m 'chore(content): synchronize Blogger snapshot'
          git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            git push --force-with-lease="refs/heads/${branch}:$(git rev-parse refs/remotes/origin/${branch})" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - name: Open or refresh reviewable synchronization PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "BLOGGER_CONTROL_PLANE_PR=${existing}"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'chore(content): synchronize Blogger snapshot' \
            --body $'Automated Blogger content-control-plane candidate.\n\nThe workflow fetched the canonical Blogger feed, rebuilt deterministic snapshot evidence, validated the complete static quality chain, and pushed only the generated snapshot + metadata sidecar.\n\nThis PR must pass the normal Next gates before merge. No workflow writes content directly to main.'
