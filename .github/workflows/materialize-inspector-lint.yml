name: Materialize Inspector lint repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-inspector-lint:
    if: github.head_ref == 'feat/brave-universal-inspector' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Inspector branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/brave-universal-inspector
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false
      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Install frozen dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile
      - name: Apply strict lint repair
        run: |
          set -euo pipefail
          git apply --check next/.inspector-lint-fix.patch
          git apply next/.inspector-lint-fix.patch
          git rm next/apps/web/components/admin/inspector-panel.tsx
          cd next
          pnpm exec prettier --write \
            apps/inspector-extension/src/content.ts \
            apps/inspector-extension/src/diagnostics.ts \
            apps/web/components/admin/admin-shell.tsx \
            scripts/check-inspector-extension.ts
          cd ..
          git diff --check
      - name: Commit materialized sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add next/apps/inspector-extension/src/content.ts \
            next/apps/inspector-extension/src/diagnostics.ts \
            next/apps/web/components/admin/admin-shell.tsx \
            next/scripts/check-inspector-extension.ts
          git add -u next/apps/web/components/admin/inspector-panel.tsx
          git commit -m 'fix: satisfy strict Inspector lint [inspector-lint-materialized]'
          git push origin HEAD:feat/brave-universal-inspector
