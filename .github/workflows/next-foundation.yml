name: Validate ZenBlog Next

on:
  pull_request:
    branches: [main, next-v1-foundation]
    paths:
      - 'next/**'
      - 'tools/quality/**'
      - 'docs/ENGINEERING-STANDARDS-50Y.md'
      - 'docs/TESTING-STANDARDS.md'
      - '.github/workflows/next-foundation.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/blogger-content-control-plane.yml'
  push:
    branches: [main, next-v1-foundation]
    paths:
      - 'next/**'
      - 'tools/quality/**'
      - 'docs/ENGINEERING-STANDARDS-50Y.md'
      - 'docs/TESTING-STANDARDS.md'
      - '.github/workflows/next-foundation.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/blogger-content-control-plane.yml'

permissions:
  contents: read

concurrency:
  group: next-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect Next workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f next/package.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'next/ workspace is not present; validation gate is dormant.'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.workspace.outputs.available == 'true'
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        if: steps.workspace.outputs.available == 'true'
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Install dependencies
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Upload generated lockfile
        if: steps.workspace.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-pnpm-lock
          path: next/pnpm-lock.yaml
      - name: Produce deterministic formatting patch
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        shell: bash
        run: |
          pnpm format
          git diff -- . > ../next-prettier.patch
          git checkout -- .
      - name: Upload formatting patch
        if: steps.workspace.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-prettier-patch
          path: next-prettier.patch
      - name: Static quality gates
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm check
      - name: Upload unit coverage evidence
        if: steps.workspace.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-unit-coverage
          path: next/coverage
          if-no-files-found: error
      - name: Upload CycloneDX SBOM
        if: steps.workspace.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-sbom-cyclonedx-1.7
          path: next/security-reports/sbom.cdx.json
          if-no-files-found: error
      - name: Install Playwright browsers
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser smoke
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm test:e2e
      - name: Rehearse GitHub Pages base-path export
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        env:
          ZENBLOG_BASE_PATH: /zenblog-pages-probe
        shell: bash
        run: |
          rm -rf apps/web/.next apps/web/out
          pnpm --filter @zenblog/web build
          test -f apps/web/out/index.html
          test -d apps/web/out/_next
          if ! grep -R -F -q --include='*.html' '/zenblog-pages-probe/_next/' apps/web/out; then
            echo 'Pages rehearsal did not emit base-path-prefixed Next assets.' >&2
            exit 1
          fi
