name: Validate ZenBlog Next

on:
  pull_request:
    branches: [main]
    paths:
      - 'next/**'
      - '.github/workflows/next-foundation.yml'
  push:
    branches: [next-v1-foundation]
    paths:
      - 'next/**'
      - '.github/workflows/next-foundation.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Next workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f next/package.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'next/ workspace is not present; validation gate is dormant.'
          fi
      - uses: actions/setup-node@v4
        if: steps.workspace.outputs.available == 'true'
        with:
          node-version: 24.19.0
      - name: Install pnpm
        if: steps.workspace.outputs.available == 'true'
        run: npm install --global pnpm@11.22.0
      - name: Install dependencies
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm install --no-frozen-lockfile
      - name: Upload generated lockfile
        if: steps.workspace.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: next-pnpm-lock
          path: next/pnpm-lock.yaml
      - name: Static quality gates
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm check
      - name: Install Playwright browsers
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser smoke
        if: steps.workspace.outputs.available == 'true'
        working-directory: next
        run: pnpm test:e2e
