name: Validate Next.js Pages Application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: next-pages-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Assert durable Pages repository boundary
        run: .github/scripts/assert-repository-boundary.sh

  quality:
    needs: repository-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact quality SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0

      - name: Install frozen dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile

      - name: Diagnostic — canonicalize Admin About stylesheet
        working-directory: next
        run: pnpm exec prettier --write apps/web/app/admin/admin-about-layout.css

      - name: Upload canonical Admin About stylesheet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prettier-admin-about-layout
          path: next/apps/web/app/admin/admin-about-layout.css
          if-no-files-found: error

      - name: Full static, architecture, portability and unit gate
        working-directory: next
        run: pnpm check

      - name: Upload unit coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-unit-coverage
          path: next/coverage
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-sbom-cyclonedx-1.7
          path: next/security-reports/sbom.cdx.json
          if-no-files-found: error

      - name: Install Playwright browsers
        working-directory: next
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Cross-browser E2E — full suite across 4 projects
        working-directory: next
        run: pnpm test:e2e

      - name: Rehearse provider-neutral static export under a non-production base path
        working-directory: next
        env:
          ZENBLOG_BASE_PATH: /portable-delivery-probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/web/out
          pnpm --filter @zenblog/web build
          test -f apps/web/out/index.html
          test -d apps/web/out/_next
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          node scripts/check-portable-export.ts
