name: Validate Next.js Pages Application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: next-pages-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-inspector-lint:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/brave-universal-inspector' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Inspector branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/brave-universal-inspector
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0

      - name: Install frozen dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile

      - name: Materialize strict Inspector repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(relative: str, old: str, new: str) -> None:
              path = Path(relative)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{relative}: expected exactly one replacement, found {count}')
              path.write_text(text.replace(old, new, 1))

          content = 'next/apps/inspector-extension/src/content.ts'
          replace_once(content, ') => boolean | void', ') => boolean | undefined')
          replace_once(
              content,
              "type ZenInspectorTag = keyof HTMLElementTagNameMap;\n\n(() => {",
              """type ZenInspectorTag = keyof HTMLElementTagNameMap;

function isZenInspectorToggleMessage(message: unknown): message is ZenInspectorToggleMessage {
  if (typeof message !== 'object' || message === null || !('type' in message)) return false;
  const candidate = message as Readonly<{ type?: unknown }>;
  return candidate.type === 'zen-inspector:toggle';
}

(() => {"""
          )
          replace_once(
              content,
              """      const copied = document.execCommand('copy');
      copyStatus.textContent = copied ? 'Copiado' : 'Seleccionado para copiar';""",
              "      copyStatus.textContent = 'No se pudo copiar; log seleccionado';"
          )
          replace_once(
              content,
              """      if (
        typeof message !== 'object' ||
        message === null ||
        !('type' in message) ||
        (message as ZenInspectorToggleMessage).type !== 'zen-inspector:toggle'
      ) {
        return false;
      }""",
              "      if (!isZenInspectorToggleMessage(message)) return false;"
          )

          diagnostics = 'next/apps/inspector-extension/src/diagnostics.ts'
          replace_once(diagnostics, "typeof globalThis.CSS?.escape === 'function'", "typeof globalThis.CSS.escape === 'function'")
          replace_once(
              diagnostics,
              """  return (
    (element.textContent ?? '').replace(/\\s+/gu, ' ').trim().slice(0, 320) || 'Sin texto visible'
  );""",
              "  return element.textContent.replace(/\\s+/gu, ' ').trim().slice(0, 320) || 'Sin texto visible';"
          )
          replace_once(
              diagnostics,
              "    .join('\\n');\n}",
              "    .join('\\n');\n}\n\nObject.assign(globalThis, { zenInspectorBuildLog });"
          )

          admin = 'next/apps/web/components/admin/admin-shell.tsx'
          replace_once(admin, "import { InspectorPanel } from './inspector-panel';\n", '')
          replace_once(admin, "type AdminTab = 'metadata' | 'search' | 'about' | 'inspector';", "type AdminTab = 'metadata' | 'search' | 'about';")
          replace_once(
              admin,
              """  { id: 'about', label: 'Acerca de' },
  { id: 'inspector', label: 'Inspector' }""",
              "  { id: 'about', label: 'Acerca de' }"
          )
          replace_once(
              admin,
              """        <section
          id="zas-pane-inspector"
          className="zas-pane"
          role="tabpanel"
          aria-label="Inspector"
          hidden={activeTab !== 'inspector'}
        >
          <InspectorPanel />
        </section>
""",
              ''
          )

          contract = 'next/scripts/check-inspector-extension.ts'
          replace_once(
              contract,
              "for (const legacy of [\n  'apps/web/components/inspector-runtime.tsx',",
              "for (const legacy of [\n  'apps/web/components/admin/inspector-panel.tsx',\n  'apps/web/components/inspector-runtime.tsx',"
          )
          PY
          git rm next/apps/web/components/admin/inspector-panel.tsx
          cd next
          pnpm exec prettier --write \
            apps/inspector-extension/src/content.ts \
            apps/inspector-extension/src/diagnostics.ts \
            apps/web/components/admin/admin-shell.tsx \
            scripts/check-inspector-extension.ts
          cd ..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add next/apps/inspector-extension/src/content.ts \
            next/apps/inspector-extension/src/diagnostics.ts \
            next/apps/web/components/admin/admin-shell.tsx \
            next/scripts/check-inspector-extension.ts
          git add -u next/apps/web/components/admin/inspector-panel.tsx
          git commit -m 'fix: satisfy strict Inspector lint [inspector-lint-materialized]'
          git push origin HEAD:feat/brave-universal-inspector

  repository-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Assert durable Pages repository boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(find . -mindepth 1 -maxdepth 1 ! -name .git -printf '%f\n' | sort)
          expected=(.github README.md next)
          [[ "${roots[*]}" == "${expected[*]}" ]]

          test -f next/package.json
          test -f next/apps/web/app/sitemap.ts
          test -f next/packages/site-config/src/index.ts
          test -f next/packages/content-catalog/src/index.ts
          test -f next/packages/domain/src/schema.ts
          test -f next/docs/ADR-006-50-YEAR-PORTABLE-CORE.md
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy-pages.yml
          test -f .github/workflows/pages-stale-guard.yml

          test ! -e tools
          test ! -e src
          test ! -e config
          test ! -e docs
          test ! -e .specify
          test ! -e .nojekyll
          test -z "$(find . -maxdepth 1 -name '.pages-refactor-payload*' -print -quit)"
          test -z "$(find .github/workflows -type f \( -name '*blogger*' -o -name '*export*' -o -name '*fix-r3b*' -o -name '*split-migration*' \) -print -quit)"
          test -z "$(find next -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.jsx' \) -print -quit)"
          echo 'PAGES_REPOSITORY_BOUNDARY=PASS'

  quality:
    needs: repository-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact quality SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0

      - name: Install frozen dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile

      - name: Full static, architecture, portability and unit gate
        working-directory: next
        run: pnpm check

      - name: Upload unit coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-unit-coverage
          path: next/coverage
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-sbom-cyclonedx-1.7
          path: next/security-reports/sbom.cdx.json
          if-no-files-found: error

      - name: Install Playwright browsers
        working-directory: next
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Cross-browser E2E — full suite across 4 projects
        working-directory: next
        run: pnpm test:e2e

      - name: Rehearse provider-neutral static export under a non-production base path
        working-directory: next
        env:
          ZENBLOG_BASE_PATH: /portable-delivery-probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/web/out
          pnpm --filter @zenblog/web build
          test -f apps/web/out/index.html
          test -d apps/web/out/_next
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          grep -R -F -q --include='*.html' '/portable-delivery-probe/_next/' apps/web/out
          ! grep -R -E -i -q 'blogspot|blogger' apps/web/out
