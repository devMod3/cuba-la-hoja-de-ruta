name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0

      - name: Install frozen dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile

      - name: Refuse production artifact unless all static and unit gates pass
        working-directory: next
        run: pnpm check

      - name: Install Playwright browsers
        working-directory: next
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Refuse production unless cross-browser E2E passes
        working-directory: next
        run: pnpm test:e2e

      - name: Configure Pages metadata
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build static export for the real Pages base path
        working-directory: next
        env:
          ZENBLOG_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf apps/web/.next apps/web/out
          pnpm --filter @zenblog/web build

      - name: Verify production artifact
        working-directory: next
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          test -d apps/web/out/_next
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          test -n "$(find apps/web/out -type f -print -quit)"
          node scripts/check-portable-export.ts apps/web/out "${{ steps.pages.outputs.base_path }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: next/apps/web/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deploy exact build artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
