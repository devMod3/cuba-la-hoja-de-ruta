name: Q-046 Temporary Lockfile Writer

on:
  push:
    branches: [q046-project-wide-testing-standards]

permissions:
  contents: write

concurrency:
  group: q046-lockfile-writer
  cancel-in-progress: false

jobs:
  write-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: q046-project-wide-testing-standards
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Regenerate exact lockfile
        working-directory: next
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Commit only lockfile delta
        shell: bash
        run: |
          if git diff --quiet -- next/pnpm-lock.yaml; then
            echo 'LOCKFILE_ALREADY_CURRENT=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add next/pnpm-lock.yaml
          git diff --cached --name-only | grep -Fx 'next/pnpm-lock.yaml'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'LOCK Q-046: regenerate pnpm lockfile'
          git push origin HEAD:q046-project-wide-testing-standards
