name: TEMP Validate ZenBlog Next Q042

on:
  push:
    branches: [q042-sanitized-article-html]
    paths:
      - 'next/**'
      - '.github/workflows/next-q042-validate-temp.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Install dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile
      - name: Produce deterministic formatting patch
        working-directory: next
        shell: bash
        run: |
          pnpm format
          git diff -- . > ../q042-prettier.patch
          git checkout -- .
      - name: Upload formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q042-prettier-patch
          path: q042-prettier.patch
      - name: Static quality gates
        working-directory: next
        run: pnpm check
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q042-sbom-cyclonedx-1.7
          path: next/security-reports/sbom.cdx.json
          if-no-files-found: error
      - name: Install Playwright browsers
        working-directory: next
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser smoke
        working-directory: next
        run: pnpm test:e2e
