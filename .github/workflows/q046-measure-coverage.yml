name: Q-046 Measure Testing Baseline

on:
  push:
    branches: [q046-project-wide-testing-standards]

permissions:
  contents: read

concurrency:
  group: q046-testing-baseline
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Measure legacy coverage
        run: npm run test:coverage
      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Regenerate deterministic Next lockfile
        working-directory: next
        run: pnpm install --no-frozen-lockfile
      - name: Measure Next unit coverage
        working-directory: next
        run: pnpm test:coverage
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q046-pnpm-lock
          path: next/pnpm-lock.yaml
          if-no-files-found: error
      - name: Upload Next coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q046-next-coverage
          path: next/coverage
          if-no-files-found: error
