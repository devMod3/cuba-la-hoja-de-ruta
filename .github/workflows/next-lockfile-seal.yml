name: TEMP Seal ZenBlog Next Lockfile

on:
  push:
    branches: [next-v1-foundation]
    paths:
      - '.github/workflows/next-lockfile-seal.yml'

permissions:
  contents: write

jobs:
  seal:
    if: ${{ github.repository == 'devMod3/cuba-la-hoja-de-ruta' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next-v1-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install exact pnpm
        run: npm install --global pnpm@11.22.0
      - name: Generate and verify lockfile
        working-directory: next
        shell: bash
        run: |
          set -euo pipefail
          test ! -f pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile
          printf '%s  %s\n' 'f826cff2d3f8895587bd3e84605116e7ea66bf517dd2d516cac3275e55c1fbcb' 'pnpm-lock.yaml' | sha256sum --check --strict
      - name: Commit only the lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- next/pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = 'next/pnpm-lock.yaml'
          git commit -m 'NEXT: seal deterministic pnpm lockfile'
          git push origin HEAD:next-v1-foundation
