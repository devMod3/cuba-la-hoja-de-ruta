name: TEMP Regenerate ZenBlog Next Q040 Lockfile

on:
  push:
    branches: [next-v1-foundation]
    paths:
      - '.github/workflows/next-q040-lock-temp.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.repository == 'devMod3/cuba-la-hoja-de-ruta' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: next-v1-foundation
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Regenerate lockfile without lifecycle scripts
        working-directory: next
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Record cryptographic metadata
        working-directory: next
        shell: bash
        run: |
          set -euo pipefail
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          COUNT="$(grep -c 'resolution: {integrity:' pnpm-lock.yaml)"
          printf 'lockfileSha256=%s\nlockfileEntries=%s\n' "$LOCK_SHA" "$COUNT" > security/q040-lock-metadata.txt
      - name: Commit only lockfile and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- next/pnpm-lock.yaml next/security/q040-lock-metadata.txt
          CHANGED="$(git diff --cached --name-only)"
          if [[ -z "$CHANGED" ]]; then exit 0; fi
          while IFS= read -r path; do
            case "$path" in
              next/pnpm-lock.yaml|next/security/q040-lock-metadata.txt) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          git commit -m 'NEXT Q-040: seal dependency graph after CMS decoupling'
          git push origin HEAD:next-v1-foundation
