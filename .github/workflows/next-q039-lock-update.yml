name: TEMP Q039 ZenBlog Next Lock Update

on:
  push:
    branches: [next-v1-foundation]
    paths:
      - 'next/apps/web/package.json'
      - '.github/workflows/next-q039-lock-update.yml'

permissions:
  contents: write

jobs:
  update-lock:
    if: ${{ github.repository == 'devMod3/cuba-la-hoja-de-ruta' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: next-v1-foundation
          persist-credentials: true
      - name: Detect exact Q-039 workspace dependency
        id: ready
        shell: bash
        run: |
          if grep -Fq '"@zenblog/cms-blogger": "workspace:*"' next/apps/web/package.json; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ready.outputs.value == 'true'
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact pnpm
        if: steps.ready.outputs.value == 'true'
        run: npm install --global --ignore-scripts pnpm@11.22.0
      - name: Regenerate lockfile without install scripts
        if: steps.ready.outputs.value == 'true'
        working-directory: next
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Record lock metadata
        if: steps.ready.outputs.value == 'true'
        working-directory: next
        shell: bash
        run: |
          set -euo pipefail
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          COUNT="$(grep -c 'resolution: {integrity:' pnpm-lock.yaml)"
          printf 'lockfileSha256=%s\nlockfileEntries=%s\n' "$LOCK_SHA" "$COUNT" > security/q039-lock-metadata.txt
      - name: Commit only lockfile and metadata
        if: steps.ready.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- next/pnpm-lock.yaml next/security/q039-lock-metadata.txt
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED=$'next/pnpm-lock.yaml\nnext/security/q039-lock-metadata.txt'
          test "$CHANGED" = "$EXPECTED"
          git diff --cached --quiet && exit 0
          git commit -m 'NEXT Q-039: update workspace lockfile'
          git push origin HEAD:next-v1-foundation
